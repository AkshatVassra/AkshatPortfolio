name: Deploy to Cloudflare Worker (static assets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish Worker with static assets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler@3 publish ./dist --name akshatxportfolio-worker --account-id $CF_ACCOUNT_ID
